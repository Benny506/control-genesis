<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Clean Crisp White Sticker Base with Rounded Die-Cut Corners -->
  <rect x="15" y="15" width="570" height="870" rx="24" ry="24" fill="#FFFFFF" stroke="#EFEFEF" stroke-width="2"/>

  <!-- ================= 1. NOURIVA EMBLEM (TOP) ================= -->
  <g transform="translate(300, 160) scale(1.2)">
    <!-- Base 'N' Stem (Left & Diagonal) -->
    <path d="M -50 25 L -50 -40 C -50 -46 -46 -50 -40 -50 L -30 -50 C -24 -50 -20 -46 -20 -40 L -20 -5 L 12 -45 C 16 -50 22 -52 28 -50 L 32 -48 C 38 -45 42 -39 42 -32 L 42 25 C 42 31 38 35 32 35 L 22 35 C 16 35 12 31 12 25 L 12 -8 L -20 31 C -24 35 -30 37 -36 35 L -42 33 C -47 30 -50 28 -50 25 Z" 
          fill="#1C402E"/>
    
    <!-- Organic Leaf Extension on Right -->
    <path d="M 12 -28 C 12 -55 35 -72 65 -72 C 65 -42 48 -20 22 -14 Z" 
          fill="#1C402E"/>
    <!-- Leaf Center Spine -->
    <path d="M 16 -30 Q 38 -46 58 -66" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Golden Amber Droplet Falling from Leaf Tip -->
    <path d="M 75 -35 C 75 -46 86 -62 86 -62 C 86 -62 97 -46 97 -35 C 97 -24 88 -15 75 -35 Z" 
          fill="#D69C4A" transform="rotate(180 86 -38) translate(0, -18)"/>
  </g>

  <!-- ================= 2. TAGLINE ================= -->
  <text x="300" y="280" text-anchor="middle" class="font-sans" font-size="16" font-weight="700" fill="#1C402E" letter-spacing="5">
    NATURE IN EVERY SIP
  </text>

  <!-- ================= 3. MASTER BRAND: NOURIVA ================= -->
  <text x="300" y="420" text-anchor="middle" class="font-sans" font-size="82" font-weight="900" fill="#1C402E" letter-spacing="-1">
    NOURIVA
  </text>

  <!-- ================= 4. FLAVOR VARIANT PILL BADGE ================= -->
  <!-- Dedicated Golden-Almond Pill Container to cleanly separate brand from flavor -->
  <g transform="translate(300, 530)">
    <rect x="-240" y="-48" width="480" height="96" rx="48" fill="#D69C4A"/>
    <text x="0" y="16" text-anchor="middle" class="font-sans" font-size="44" font-weight="900" fill="#1C402E" letter-spacing="3">
      TIGER NUT
    </text>
  </g>

  <!-- ================= 5. PRODUCT SPECS ================= -->
  <text x="300" y="650" text-anchor="middle" class="font-sans" font-size="17" font-weight="600" fill="#3D5A46" letter-spacing="1">
    Cold-Pressed • 100% Organic • No Preservatives
  </text>

  <!-- Subtle Accent Line -->
  <line x1="220" y1="700" x2="380" y2="700" stroke="#E5E5E5" stroke-width="1.5"/>

  <!-- ================= 6. CONTACT & HANDLING FOOTER ================= -->
  <g transform="translate(300, 770)">
    <!-- Phone / WhatsApp Icon -->
    <g transform="translate(-135, -17) scale(1.1)">
      <circle cx="12" cy="12" r="12" fill="#1C402E"/>
      <path d="M 12 5 A 7 7 0 0 0 5.8 15.5 L 5 19 L 8.6 18.2 A 7 7 0 1 0 12 5 Z M 15.1 13.6 C 14.9 14 14.3 14.4 13.8 14.5 C 13.4 14.5 13 14.6 11.3 13.9 C 9.3 13 7.9 10.9 7.8 10.7 C 7.7 10.6 7 9.7 7 8.7 C 7 7.7 7.4 7.3 7.6 7.1 C 7.8 6.9 8 6.8 8.2 6.8 C 8.3 6.8 8.5 6.8 8.6 6.8 C 8.8 6.8 8.9 6.7 9.1 7.1 C 9.3 7.5 9.6 8.5 9.7 8.6 C 9.8 8.7 9.8 8.9 9.7 9 C 9.6 9.2 9.5 9.3 9.4 9.4 C 9.3 9.5 9.2 9.7 9.1 9.8 C 9 9.9 8.8 10.1 9 10.3 C 9.1 10.5 9.6 11.3 10.3 11.9 C 11.2 12.7 12 13 12.2 13.1 C 12.4 13.2 12.5 13.2 12.7 13 C 12.9 12.8 13.2 12.3 13.4 12 C 13.6 11.7 13.8 11.8 14 11.8 C 14.2 11.9 15.3 12.5 15.5 12.6 C 15.7 12.7 15.8 12.8 15.9 12.9 C 15.9 13.1 15.7 13.5 15.1 13.6 Z" fill="#FFFFFF"/>
    </g>

    <!-- Phone Number -->
    <text x="-100" y="3" class="font-sans" font-size="24" font-weight="800" fill="#1C402E" letter-spacing="1">
      08148903964
    </text>
  </g>

  <!-- Storage Instruction -->
  <text x="300" y="820" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#1C402E" letter-spacing="2">
    SHAKE WELL • KEEP REFRIGERATED
  </text>
</svg>
